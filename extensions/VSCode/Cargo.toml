# `Cargo.toml` -- Rust interface for the VSCode extension
# =======================================================
#
# General package configurations
# ------------------------------
[package]
authors.workspace = true
categories.workspace = true
description = "A programmer's word processor."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "codechat-editor-vscode-extension"
readme = "../README.md"
repository.workspace = true
version.workspace = true

# `cargo machete` doesn't scan `build.rs`, so it can't see `napi-build` used
# there.
[package.metadata.cargo-machete]
ignored = ["napi-build"]

[lib]
crate-type = ["cdylib"]

[dependencies]
codechat-editor-server.workspace = true
log.workspace = true
napi = { version = "3.0.0", features = ["tokio_rt"] }
napi-derive = "3.0.0"
serde_json = "1.0.145"

[build-dependencies]
napi-build = "2"

# Lints
# -----
#
# Profiles and lint configuration live in the workspace root manifest.
[lints]
workspace = true
