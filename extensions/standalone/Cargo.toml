# `Cargo.toml` -- Rust build/package management config for the standalone CLI
# ===========================================================================
#
# General package configurations
# ------------------------------
[package]
authors.workspace = true
categories.workspace = true
description = "A programmer's word processor -- standalone command-line server."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "codechat-editor-standalone"
readme = "../../README.md"
repository.workspace = true
version.workspace = true

# Dependencies
# ------------
#
# `cargo sort` orders a `[target]` table ahead of `[dependencies]`, so the
# platform-specific dependencies lead this section.
#
# ### Windows-only dependencies
#
# See the
# [Cargo docs](https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html#platform-specific-dependencies)
# on platform-specific dependencies.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }

# ### All-platform dependencies
[dependencies]
actix-rt = "2.9.0"
actix-web = "4"
clap = { version = "4", features = ["derive"] }
codechat-editor-server.workspace = true
dunce = "1.0.5"
indoc = "2.0.5"
log.workspace = true
minreq = "3"
notify-debouncer-full = "0.7"
rand = "0.10"
regex = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
webbrowser = "1.0.5"

# ### Development-only dependencies
[dev-dependencies]
actix-http = "3.9.0"
assert_cmd = "2"
path-slash = "0.2.1"
predicates = "3.1.2"
pretty_assertions = "1.4.1"
test_utils.workspace = true
url = "2.5.2"

# Lints
# -----
#
# Profiles and lint configuration live in the workspace root manifest.
[lints]
workspace = true
