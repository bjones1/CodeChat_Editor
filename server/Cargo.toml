# `Cargo.toml` -- Rust build/package management config for the server
# ===================================================================
#
# General package configurations
# ------------------------------
[package]
authors.workspace = true
categories.workspace = true
description = "A programmer's word processor."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "codechat-editor-server"
readme = "../README.md"
repository.workspace = true
version.workspace = true

# This library allows other packages to use core CodeChat Editor features.
[lib]
name = "code_chat_editor"

# Dependencies
# ------------
[dependencies]
actix-files = "0.7"
actix-rt = "2.9.0"
actix-server = "2.6.0"
actix-web = "4"
actix-web-httpauth = "0.8.2"
actix-ws = "0.4"
ammonia = "4.1.2"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
dprint-plugin-markdown = { git = "https://github.com/bjones1/dprint-plugin-markdown.git", branch = "all-fixes" }
dunce = "1.0.5"
futures-util = "0.3.29"
htmd = { git = "https://github.com/bjones1/htmd.git", branch = "dom-interface", version = "0.5" }
# This must match the version of `markup5ever_rcdom`.
html5ever = "0.39"
htmlize = "1.0.6"
imara-diff = { version = "0.2", features = [] }
indoc = "2.0.5"
log.workspace = true
log4rs = "1.3"
markup5ever_rcdom = "0.39"
mime = "0.3.17"
mime_guess = "2.0.5"
minify-html = { git = "https://github.com/bjones1/minify-html.git", branch = "dev", version = "0.18.1" }
minreq = { version = "3", features = ["https-rustls-probe", "proxy"] }
normalize-line-endings = "0.3.0"
path-slash = "0.2.1"
pest = "2.7.14"
pest_derive = "2.7.14"
phf = { version = "0.14", features = ["macros"] }
# Per the [docs](https://docs.rs/crate/pulldown-cmark/latest), skip building the
# binary.
pulldown-cmark = { version = "0.13", default-features = false, features = [
    "html",
] }
rand = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
test_utils.workspace = true
thiserror = "2.0.12"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"
url = "2.5.2"
urlencoding = "2"
webbrowser = "1.0.5"

# ### Development-only dependencies
[dev-dependencies]
assert_fs = "1"
assertables = "10"
# Used by the accessibility tests to timestamp the reports they write, so that
# a stale report is visible as stale.
chrono = "0.4"
futures = "0.3.31"
predicates = "3.1.2"
pretty_assertions = "1.4.1"
thirtyfour = "0.37"
tokio-tungstenite = "0.30"

# Lints
# -----
#
# Profiles, the `[patch]` table, and lint configuration all live in the
# workspace root manifest.
[lints]
workspace = true
