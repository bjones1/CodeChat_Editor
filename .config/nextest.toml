# `nextest.toml` -- a cargo-nextest configuration file
# ====================================================
#
# See the [docs](https://nexte.st/docs/configuration/) for this file. nextest
# reads it only from `.config/` in the workspace root.
#
# Browser-backed tests
# --------------------
#
# The `overall` test binary (`server/tests/overall.rs`, which gathers the
# `overall_*.rs` modules) drives a browser through WebDriver. Overlapping
# WebDriver sessions are unreliable on macOS CI, so run these tests one at a
# time. nextest runs each test in its own process; a
# [test group](https://nexte.st/docs/configuration/test-groups/) limits how many
# of those processes run at once, while other tests still run in parallel.
[test-groups]
web-driver = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary_id(codechat-editor-server::overall)"
test-group = "web-driver"
