# ONE-TIME diagnostic workflow. Delete this file once you've captured the ID below.
#
# The VS Marketplace publisher "Members" page needs the managed identity's
# Azure DevOps/VSTS profile ID (a GUID), which is different from its Azure
# resource ID. The only way to get it is to ask for it *as* the managed
# identity, via `az rest` against the VSTS profile endpoint. This workflow
# does that using the GitHub Actions OIDC trust already configured on
# id-vscode-marketplace-publish.
name: Get Managed Identity VSTS ID (one-time)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  get-id:
    runs-on: ubuntu-22.04
    # Must match the federated credential's subject (repo:...:environment:marketplace-publish)
    environment: marketplace-publish
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: 144c1898-0dd4-449b-bc7b-9ee72919a565
          tenant-id: 351e566f-3458-409c-8271-b3fb4b59c505
          subscription-id: 9137d49b-639e-42b6-98d2-418fc572cd09
      - name: Get VSTS profile id for this identity
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798
